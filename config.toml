# lodgingbuddy settings.
#
# Every key here has a built-in default in config.py, so you can delete any line
# — or this whole file — and the tool still runs. Set LODGINGBUDDY_CONFIG to use
# a different file.
#
# This file is what everything shares. Two narrower layers go over it:
#
#   cities/edinburgh.cityconf.toml
#       the place. What its write-ups call the castle, which places are worth
#       walking to, what tax is charged and in what currency. True of every trip
#       you ever take there, so it is kept under the city's name and committed —
#       a database that names the city gets it.
#
#   <db>.dbconf.toml
#       the trip. Which city this database is in, and anything true of this one
#       and not of the place: how many ways the bill splits, a must-have that
#       only matters this time. Sits beside the <db>.db.json it belongs to.
#
# Each says in its own name which of the three it is, so a database named after
# the city it is in still gives you three files you can tell apart at a glance.
#
# Tables merge key by key; a list in a narrower file replaces the list here
# outright. [storage] is the exception and is only ever read from this file,
# since it is what says where the other two live.


[storage]
# Where captured stays are kept. A relative path sits next to the script.
file = "stays.db.json"
# Every other .db.json in that same folder is a database too, and `db <name>`
# moves between them — real candidates in one, throwaway examples in another,
# without a flag on every line. The choice sticks until you change it, so the
# prompt is named after the database you're in. LODGINGBUDDY_DB wins for a
# single run without moving the pointer.

# Where city configs are kept — a relative path sits next to the script, not
# next to the stays. Deliberately: what's in them is knowledge about a place,
# committed and shared, where the stays are yours.
cities = "cities"


[http]
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
timeout_seconds = 25
# en-GB keeps UK sites quoting in pounds rather than guessing from the IP.
accept_language = "en-GB,en;q=0.9"


[tax]
# UK VAT, added to any price a site flags as pre-tax. Applies to the Scottish
# stays this tool is aimed at; change it if you point it somewhere else.
vat_rate = 0.20


[currency]
# Prices are held in `base`. `list --rate` converts them to `quote` for display.
base = "GBP"
quote = "USD"
# Default for `list --rate`; 0 means don't convert unless asked on the day.
default_rate = 0
# Assumed for `set --native-price` when no --native-currency is given.
native_default = "GBP"


[split]
# How many ways the bill divides — which is not how many people are going. A
# couple and a singleton settling half each are two shares, not three. Override
# one stay that splits differently with `set <id> --shares N`.
shares = 2
# What one share is called, for the table header and `show`.
label = "share"


[display]
# Which of the sorts `list` opens on: value, share, price, score, points,
# sleeps, walk, checkin, name. Value is points per unit of cost, which is the
# question you opened the table to ask — cheapest is a different one, and
# `list --sort share` is still there for it.
default_sort = "value"
# Which columns `list` prints, and in what order. Pick from: source, where,
# checkin, nts, slp, space, all_in, share_nt, score, reviews, clean, look,
# walk, kind, traits, points, value. All of them at once is wider than a
# terminal, and which ones earn their place changes with the trip — `where` and
# `checkin` say nothing when every stay is the same town on the same dates.
#
# `name` is listed here for old configs and is not one of them: the title heads
# the left-hand pane, with the write-up wrapped underneath it, and the columns
# are what sits to the right of the seam. Naming it changes nothing either way.
#
# A column every stay answers identically isn't printed at all — it is said in
# one line under the table instead. Thirty rows of "booking.com" is a caption
# in the wrong place, and it was sitting between the name and the numbers.
columns = ["name", "source", "space", "slp", "walk", "all_in", "share_nt",
           "score", "points", "value"]
# Between columns, and the character the rules are drawn with.
column_gap = "  "
rule_char = "─"
# Columns truncate rather than wrap, so the table stays one row per stay.
# `name_width` is unused now that the title sizes itself — see `title_width`.
name_width = 30
source_width = 11
where_width = 20

# How wide the title column is, which is also how wide the write-up under it
# wraps. 0 fits it to the terminal: the numbers take what they need and the
# title gets everything left over, so widening the window widens the only
# column that can use it. Held between 28 and 56 either way — narrower can't
# name a place, wider is a paragraph. On a terminal too narrow for both, the
# value bar is dropped before the title is.
title_width = 0

# A rule between stays, every N of them. 1 gives each stay its own block, which
# is what makes the unlabelled write-up readable; 5 groups them; 0 draws none.
# The rules cross the column seams rather than running over them.
rule_every = 1

# A bar beside Value, scaled to the best in the table. It says nothing the
# number doesn't — it says it in a shape you can read without reading, which is
# what the top of a sorted table is for.
value_bars = true

# auto | always | never. "auto" is on at a terminal and off down a pipe, so
# `list > shortlist.txt` and `list | grep Leith` are the same characters they
# always were. Nothing is said only by colour: it dims the write-up and the
# units, and picks out the header and the first three rows. NO_COLOR in the
# environment turns it off whatever this says.
colour = "auto"

# What the listing's own write-up said, under each row: what kind of place it
# is, who sleeps where, the facts nothing else has a column for, and the nearest
# places it bothered to time.
#
# "lines" is both halves — what the place is, then what's around it. "line" is
# the first only; "off" leaves the table one row each. There are `kind` and
# `traits` columns above for the middle ground, and `list --no-facts` turns it
# off for one run. It sits under the title rather than in a column because
# there is no width at which "soundproofed, historic building, private
# entrance" fits one, and the trait that decides a stay is exactly the one a
# truncated column would drop.
#
# Unlabelled, and kept inside the title's column rather than run out under the
# figures — that is what gives the numbers a straight left edge to follow. What
# marks where one half ends is a hanging indent: a line flush with the margin
# starts something new, an indented line is the last one carrying on.
facts = "lines"
# The most lines of write-up one stay gets, across both halves. 0 lets a stay
# have as many as it has something to say for, which is the honest setting if
# you don't mind the height — every stay still keeps at least one line for
# what's around it before any stay gets a second for what's in it.
facts_lines = 0
# The most traits the line will name before "+3" — an upper bound, not a
# target. What actually decides is the width of your terminal: the line is
# fitted to it and never wraps, because a two-line row in a thirty-row table
# costs more than the second line is worth.
#
# Which traits get the room is decided per table rather than by a fixed order.
# The ones that could change your mind come first, and within those the ones
# fewest of the other stays share — `microwave` is true of eleven of the thirty
# Edinburgh flats and settles nothing, `adults_only` is true of one. Filter the
# table and it re-ranks, because a trait they all share has stopped saying
# anything about any of them.
facts_traits = 8

# How many links `list` prints under the table, taken from the top of whatever
# order it just sorted into. The table tells you which stay wins; this is what
# you do about it — the row itself has nowhere to put a URL, and a listing you
# can't get back to is one you can't book.
#
# They print in full and unwrapped, because a Booking.com link carries the
# dates, the party and the room block that produced the price in its row, and a
# trimmed one lands you on a different quote. Three is about what fits before
# the table above them scrolls away; 0 prints none, and `list --links 10` or
# `--links 0` overrides this for one run. `url <id>` fetches any single one.
links = 3

# Leading glyph per record status.
[display.status_marks]
ok = " "
needs_price = "·"
blocked = "!"

# Trails the all-in price to say how tax got there. `=` is the one worth
# knowing: the page stated its rates and fees, so that figure is the arithmetic
# done rather than a flat VAT estimate.
[display.tax_marks]
inclusive = ""
added = "+"
computed = "="
unknown = "?"

# Leads a row that fails a must-have in [filters], or that we can't tell about.
[display.gate_marks]
fail = "✗"
unknown = "?"


[booking]
# Booking.com encodes the selected room block's price on the end of
# sr_pri_blocks in minor units. These bounds reject the other numbers that
# pattern catches — a £40 fragment, an ID that happens to parse.
min_price = 10
max_price = 100000


# ── What you actually want ────────────────────────────────────────────────
#
# This is the part you re-tune per trip. Price is not in here, on purpose:
# `points` is pure desirability, and cost comes back separately as the
# denominator of `value` (points per £25 a share a night). Mixing price into
# the score can't tell a cheap disappointment from an expensive one.
#
# Tiers are not additive — a quantity falls into the first band it qualifies
# for and takes that band's points, so list them generous-first. Everything a
# tier reads is normalised to 0–100 first, which is why a five-star site, a
# ten-point site and your own mark out of 5 all fit one table.

[scoring]
# Only sets the scale of `value` — at 25 it reads "points per £25 a share a
# night". Changing it relabels the column without reordering the table.
price_unit = 25

# Can we walk it, or are we driving? The one location question worth asking.
[scoring.tiers.walk_minutes]
direction = "lower"
steps = [
  { max = 10, points = 25 },   # out the door and you're there
  { max = 20, points = 15 },   # a walk, but nobody complains
  { max = 35, points = 6 },    # you'd do it once, in good weather
]

# What previous guests said, as a percentage of full marks.
[scoring.tiers.guest_score]
direction = "higher"
steps = [
  { min = 90, points = 20 },
  { min = 80, points = 12 },
  { min = 70, points = 5 },
]

# How much that score is worth. 9.8 from four reviews is not 9.8.
[scoring.tiers.reviews]
direction = "higher"
steps = [
  { min = 200, points = 6 },
  { min = 50, points = 4 },
  { min = 10, points = 2 },
]

# Booking.com breaks cleanliness out as its own sub-score. Your own mark, set
# with `set <id> --clean N`, overrides it.
[scoring.tiers.cleanliness]
direction = "higher"
steps = [
  { min = 90, points = 12 },
  { min = 80, points = 7 },
  { min = 70, points = 2 },
]

# Aesthetic appeal, out of 5, from `set <id> --look N`. Nothing can scrape
# this — it's the one factor that is only ever your own eyes on the photos.
[scoring.tiers.look]
direction = "higher"
steps = [
  { min = 100, points = 15 },  # 5/5
  { min = 80, points = 10 },   # 4/5
  { min = 60, points = 4 },    # 3/5
]

# Beds beyond heads: somewhere to put the bags, not another body.
[scoring.tiers.spare_beds]
direction = "higher"
steps = [
  { min = 2, points = 8 },
  { min = 1, points = 5 },
]

# Who ends up on the sofa. Bedrooms are handed out to shares best-first, and
# this is how many shares the bedrooms ran out before — 0 for a couple and a
# singleton with two bedrooms, 1 when there is one bedroom and a sofa bed in
# the living room. Booking.com breaks its room block out room by room
# ("Bedroom 1: 1 queen bed", "Living room: 1 sofa bed"), which is the only
# place this is legible; a bare bedroom count answers it too.
#
# Scored apart from spare_beds because they are different questions: that one
# is elbow room, this one is privacy, and no quantity of the first buys the
# second. Worth a lot, because it is the thing most likely to decide the trip
# — but points, not a veto. A sofa bed is a real answer to where the third
# person sleeps. Two shares in one room is not, and that is a must-have below.
#
# A stay whose site never said stays unscored here rather than scoring zero —
# an unread layout mustn't read as a place where everyone gets a door.
[scoring.tiers.shares_without_a_door]
direction = "lower"
steps = [
  { max = 0, points = 25 },   # a bedroom each
  { max = 1, points = 6 },    # one of you is on the sofa bed
]

# Flat points for a fact being true. Amenity names are the canonical slugs in
# sources.py's AMENITY_ALIASES; `second_bathroom` reads the bathroom count.
#
# Anything summary.py can read out of a write-up may be named here too — the
# trait slugs in its `_TRAITS`, and the four property kinds — and they score
# exactly like an amenity does. A fact's worth doesn't depend on which part of
# the page it was printed on, and the write-up is where most of them are: of
# the thirty Edinburgh stays, four had a bathroom count in the structured data
# and seventeen said it in a sentence.
#
# Points may be negative. Some of what the prose gives you is a warning.
#
# A name nothing produces is caught at startup rather than scoring a silent
# zero, so a typo here reads as a typo.
[scoring.bonuses]
parking = 6
kitchen = 5
second_bathroom = 5
wifi = 4
hot_tub = 4
washing_machine = 3
fireplace = 3

# Read out of the write-up.
# Three nights on the Royal Mile with the windows shut is the difference
# between a good stay and no sleep, and nothing but the prose ever mentions it.
soundproofed = 4
# Above `parking`, not instead of it — a place with free parking scores both,
# which is the intent. `paid_parking` and `limited_parking` are separate slugs
# if you'd rather grade them.
free_parking = 3
# A quiet building. Only says nobody else's children, not that yours are barred.
adults_only = 2
lift = 2
self_check_in = 2
# Edinburgh's council charges this on top of the quoted price from July 2026,
# so a stay that mentions it is a stay whose bill is higher than the table says.
visitor_levy = -3
limited_parking = -2

# What's around it rather than in it, which the write-up is the only source for
# — no listing gives the neighbourhood coordinates, and "bars, restaurants,
# shops and pubs within 5 minutes' walk" decides as much as the walk to a
# named landmark does. Only claimed in the plural: a singular "restaurant" is
# the hotel's own dining room, and a "garden" is the patch behind the building.
food_nearby = 5
nightlife_nearby = 3
groceries_nearby = 3
shops_nearby = 2
green_nearby = 2
culture_nearby = 2
transport_nearby = 2
# Others summary.py knows, unweighted here because they'd all fire at once on a
# city flat and a bonus everything earns is a bonus nobody earns: historic_
# building, renovated, private_entrance, private_bathroom, bathtub, sofa_bed,
# ground_floor, upper_floor, family_rooms, reception_24h, concierge,
# luggage_storage, laundry_service, restaurant_on_site, gym, sauna, bike_parking,
# paid_parking, microwave, coffee_machine, kettle, dining_area, city_view,
# garden_view, streaming, hairdryer, toiletries, wardrobe, work_desk, licensed.
# And the kinds: apartment, aparthotel, hotel, guesthouse.


# ── Must-haves ────────────────────────────────────────────────────────────
#
# Gates, not preferences — no amount of hot tub buys back a bedroom that isn't
# there. A stay that fails one is kept and marked, never dropped.

[filters]
# Nobody sleeps in the same room as someone they didn't come with. Measured in
# shares, not heads: two shares means two rooms, whether that's a couple plus a
# singleton or two singletons. A room with two beds in it is one room, and a
# hotel booking satisfies this with two hotel rooms.
#
# A *bedroom* each is not this gate — it's `scoring.tiers.shares_without_a_door`
# above, and worth 25 points. One bedroom plus a sofa bed in the living room
# clears the must-have and loses most of those points, which is the difference
# between a stay you'd rather not book and a stay you can't.
room_per_share = true
# 0 means don't gate on it — the walk still scores, it just can't rule
# anything out.
max_walk_minutes = 0
# Amenity slugs a stay must have, e.g. ["parking", "wifi"].
require = []


# ── Where you want to be, and what the write-ups there name ───────────────
#
# `[[destination]]` and `[[landmark]]` are both facts about a city, so both live
# in that city's file — cities/edinburgh.cityconf.toml. A trip with two
# legs still in play is two databases naming two cities, and neither leg's
# numbers move while you work on the other.
#
# They can be put here instead, which is what a one-city setup would do: a
# `[[destination]]` may carry `db = "<name>"` to name the database it belongs
# to, and one that names none counts everywhere. A city file setting either list
# replaces whatever this file said.
#
#   [[destination]]  label, plus address or latitude/longitude; optional weight
#                    (its share of the average the walk tier scores) and db
#   [[landmark]]     name, optional match (a regex for how the write-ups spell
#                    it), optional latitude/longitude to check claims against

[maps]
# READ THIS ONE. `walk` sends each stay's coordinates or address, and the
# destinations listed below, to the routing service named below, over the
# internet. That is a third party learning which properties you are weighing
# up. It is the only thing in this file that does that.
#
# It ships on, because with the default provider it needs no key and nothing to
# sign up for, and how long the walk into town is decides more stays than the
# price does. Set this false and no lookup ever leaves the machine — every
# other command still works, and the walk column simply stays empty.
#
# (`add` and `refresh` fetch listing pages from the sites themselves, so those
# reach the internet too — but only the site whose link you pasted, which you
# were visiting anyway.)
enabled = true

# Measure each stay as it's captured, rather than waiting for `walk`. One
# routing call and about half a second per new stay, and the row arrives with
# nothing missing from it — which is the point, since a row with a hole in it
# is a row you can't compare. Only ever on a stay that hasn't been measured, so
# re-capturing a price costs nothing; `walk --again` re-measures after you move
# a destination. Set false to go back to measuring in one batch by hand, which
# is the same number of calls made all at once instead.
on_capture = true

# Where the router has no figure for a destination, fall back to the walk the
# listing itself claims to it — "Edinburgh Waverley station is a 6-minute walk".
# Marked "≈" in the table, so a claimed figure never passes as a measured one.
#
# Worth having on because the alternative is a hole, and a stay with no walk
# scores nothing for its location and sinks to the bottom looking remote. On the
# Edinburgh set it takes the stays with a walk figure from 10 of 30 to 22, and
# costs nothing — the numbers are already on the record, and no request goes out.
#
# It is the seller's number. What keeps it honest is summary.py checking each
# claim against the stay's own coordinates and throwing out the impossible ones;
# it caught an aparthotel claiming Edinburgh Castle was a 1-minute walk from a
# building 1.25 km away. A measured figure is never replaced by a claimed one.
# False keeps the walk column strictly to what was measured.
trust_claimed_walk = true

# Who to ask. "osrm" routes over OpenStreetMap and needs no key or account;
# "google" is the Distance Matrix and needs both.
provider = "osrm"

# OSM's public services ask to be told who is calling, and are entitled to
# refuse traffic that pretends to be a browser. This is deliberately not the
# user agent in [http], which exists to look like Chrome to listing sites.
user_agent = "lodgingbuddy (+https://github.com/maravis05/lodgingbuddy)"

# Not the demo server at router.project-osrm.org: it answers a request for the
# foot profile with car timings — identical distance and duration to /driving/,
# about 26 km/h. FOSSGIS runs an actual pedestrian profile. Getting this wrong
# is worse than not measuring, because a 2-minute drive and the 11-minute walk
# it really is land in different scoring bands.
osrm_host = "routing.openstreetmap.de"
osrm_profile = "routed-foot"

# OSRM takes coordinates only, so addresses are geocoded here first. Stays that
# already carry coordinates skip this entirely.
geocoder_host = "nominatim.openstreetmap.org"

# Both services ask for no more than one call a second. Honoured for real.
min_interval_seconds = 1.0

# Only read when provider = "google". The key comes from this environment
# variable, never from this file, which is committed. Needs Distance Matrix
# enabled.
api_key_env = "GOOGLE_MAPS_API_KEY"
host = "maps.googleapis.com"
mode = "walking"

# Sites, tried in the order listed. `domain` is matched against the URL host and
# `parser` names an adapter in sources.py (booking, sykes, or awaze). Adding
# another Awaze brand needs nothing but another entry here.
[[source]]
name = "booking.com"
domain = "booking.com"
parser = "booking"
currency = "GBP"        # Scottish properties price in GBP
score_scale = 10        # Booking rates out of 10; the cottage sites use 5
# Booking.com shows a US booker prices with VAT stripped out, then adds it back
# at checkout — a $429 room bills as $514.53. Set true if your account displays
# inclusive prices, or override one stay with `set <id> --incl-tax`.
tax_included = false

[[source]]
name = "sykes"
domain = "sykescottages.co.uk"
parser = "sykes"
currency = "GBP"
tax_included = true     # UK consumer site: prices shown inclusive
score_scale = 5

[[source]]
name = "cottages.com"
domain = "cottages.com"
parser = "awaze"
currency = "GBP"
tax_included = true
score_scale = 5

[[source]]
name = "hoseasons"
domain = "hoseasons.co.uk"
parser = "awaze"
currency = "GBP"
tax_included = true
score_scale = 5


[bookmarklet]
source = "bookmarklet.js"
output = "bookmarklet.txt"
# Importable bookmark file, so you needn't copy 30-odd KB out of a terminal.
bookmark_file = "bookmarklet.html"
# Open this one and drag the link out of it. Kept separate from the file above
# because that one has to stay strictly in the format importers parse, and this
# one has to explain itself to somebody who has never installed a bookmarklet.
install_page = "install-bookmarklet.html"
title = "Grab this stay"
# Past roughly this, some browsers refuse to store the bookmark.
max_url_bytes = 60000
